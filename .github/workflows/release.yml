# Сборка APK с моделями и публикация в GitHub Releases.
# Запускается тегом v* или вручную. Каждый запуск проверяет сборку из чистого клона.
name: Сборка APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза. Пусто: только сборка, без публикации'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Компоненты Android SDK
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" \
            "ndk;28.2.13676358" "ndk;29.0.13113456" "cmake;3.31.6" > /dev/null

      - name: Кэш моделей
        uses: actions/cache@v6
        with:
          path: models
          key: models-${{ hashFiles('config/models.lock', 'scripts/fetch_models.sh') }}

      - name: Кэш Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('src/mobile/android/gradle/libs.versions.toml', 'src/mobile/android/**/*.gradle.kts') }}
          restore-keys: gradle-

      - name: Модели и нативные библиотеки
        run: ./scripts/fetch_models.sh

      - name: Ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.STENOKOT_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.STENOKOT_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.STENOKOT_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > src/mobile/android/release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=stenokot"
              echo "keyPassword=$KEY_PASSWORD"
            } > src/mobile/android/keystore.properties
          else
            echo "::warning::Секреты подписи не заданы, APK будет подписан отладочным ключом и не обновит установленную версию"
          fi

      - name: Тесты
        working-directory: src/mobile/android
        run: ./gradlew --console=plain --no-daemon :core:test :app:testDevDebugUnitTest

      - name: Сборка APK
        working-directory: src/mobile/android
        run: ./gradlew --console=plain --no-daemon :app:assembleFullRelease

      - name: Проверка APK
        id: apk
        run: |
          APK=src/mobile/android/app/build/outputs/apk/full/release/app-full-release.apk
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          if "$AAPT2" dump permissions "$APK" | grep -E 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)'; then
            echo "::error::В APK есть сетевые разрешения"
            exit 1
          fi
          NAME="stenokot-${GITHUB_SHA::7}.apk"
          mv "$APK" "$NAME"
          sha256sum "$NAME" | tee "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
          NAME: ${{ steps.apk.outputs.name }}
        run: |
          if [ -z "$TAG" ]; then
            echo "Тег не указан, публикация пропущена"
            exit 0
          fi
          SUM=$(cut -d' ' -f1 "$NAME.sha256")
          printf 'Сборка из коммита %s.\n\nSHA-256: `%s`\n' "${GITHUB_SHA::7}" "$SUM" > notes.md
          gh release create "$TAG" "$NAME" --target "$GITHUB_SHA" --title "Стенокот $TAG" --notes-file notes.md
